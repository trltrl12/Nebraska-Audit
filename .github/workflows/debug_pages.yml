name: debug_pages

# Diagnostics for page detection: re-download already-processed PDFs and commit a per-page
# text summary to output/page_debug/ (no trimming, manifest untouched).
on:
  push:
    branches: [main]
    paths: ["config/debug_pages.txt"]
  workflow_dispatch:
    inputs:
      filenames:
        description: "Space-separated PDF filenames (blank = config/debug_pages.txt, else every file in output/manifest.csv)"
        default: ""
      ocr:
        description: "OCR scanned pages (slow)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: debug-pages
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Download and dump
        env:
          FILENAMES: ${{ inputs.filenames }}
          DUMP_OCR: ${{ inputs.ocr && '1' || '0' }}
        run: |
          mkdir -p audits
          grep -q '^ocr=1' config/debug_pages.txt 2>/dev/null && export DUMP_OCR=1
          export TESSDATA_PREFIX=$(dirname $(find /usr/share -name eng.traineddata | head -1))
          python - <<'PY'
          import csv, os, time, requests
          names = os.environ.get("FILENAMES", "").split()
          if not names and os.path.exists("config/debug_pages.txt"):
              names = [l.strip() for l in open("config/debug_pages.txt") if l.strip() and not l.startswith("#") and "=" not in l]
          rows = {r["filename"]: r for r in csv.DictReader(open("output/file_list.csv"))}
          if not names:
              names = [r["filename"] for r in csv.DictReader(open("output/manifest.csv"))]
          s = requests.Session(); s.headers["User-Agent"] = "Nebraska-Audit research pipeline"
          for n in names:
              if n not in rows: print("unknown", n); continue
              time.sleep(1.5)
              try:
                  r = s.get(rows[n]["url"], timeout=120); r.raise_for_status()
                  open(f"audits/{n}", "wb").write(r.content); print("got", n)
              except Exception as e:
                  print("failed", n, e)
          PY
          python scripts/dump_pages.py
      - name: Probe for waiver/audit PDFs behind budget-form links
        run: |
          python - <<'PY'
          import csv, time, requests
          rows = [r for r in csv.DictReader(open("output/file_list.csv")) if "Budgets_Filed" in r["url"]]
          s = requests.Session(); s.headers["User-Agent"] = "Nebraska-Audit research pipeline"
          out = []
          for r in rows:
              base = r["filename"].rsplit("_B", 1)[0]
              yr = r["fiscal_year"]
              for url in (f"https://auditors.nebraska.gov/Audits_Filed/{yr}/{base}_FY{yr}.pdf",
                          f"https://auditors.nebraska.gov/Audits_Filed/{yr}/{base}_Waiver_FY{yr}.pdf"):
                  time.sleep(0.5)
                  try:
                      h = s.head(url, timeout=30, allow_redirects=True)
                      code = h.status_code
                      ctype = h.headers.get("content-type", "")
                  except Exception as e:
                      code, ctype = "error", str(e)[:80]
                  out.append(dict(filename=r["filename"], probe_url=url, status=code, content_type=ctype))
          import os
          os.makedirs("output/page_debug", exist_ok=True)
          with open("output/page_debug/_alt_urls.csv", "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=["filename", "probe_url", "status", "content_type"])
              w.writeheader(); w.writerows(out)
          print(sum(1 for o in out if o["status"] == 200), "of", len(rows), "budget-form entities have a PDF at a probed address")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached output/page_debug 2>/dev/null || true
          git add output/page_debug
          git diff --cached --quiet && exit 0
          git commit -q -m "debug_pages: per-page text dumps [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $(( 2 ** i ))
          done
          exit 1
