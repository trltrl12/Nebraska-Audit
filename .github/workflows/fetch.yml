name: fetch

# Manual trigger: download audit PDFs in chunks, trim them to the statement pages,
# commit trimmed/ + output/ after every chunk. Re-running resumes where it stopped
# (files already in output/manifest.csv are skipped).
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Audit filing year"
        default: "2025"
      chunk_size:
        description: "PDFs per chunk (commit after each chunk)"
        default: "25"
      max_chunks:
        description: "Stop after this many chunks (0 = until done or time budget)"
        default: "0"
      time_budget_minutes:
        description: "Stop starting new chunks after this many minutes"
        default: "300"
      relist:
        description: "Rebuild the file list from the website"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: output-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Download and trim in chunks
        env:
          AUDIT_YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          budget=$(( ${{ inputs.time_budget_minutes }} * 60 ))
          chunk=0
          if [ "${{ inputs.relist }}" = "true" ]; then
            python scripts/download.py --year "$AUDIT_YEAR" --relist --list-only
          fi
          commit_push () {
            python scripts/build_csv.py
            git add trimmed/ output/ ':!output/json'
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "fetch: $1 [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && return 0
              sleep $(( 2 ** i ))
            done
            echo "push failed"; return 1
          }
          while :; do
            chunk=$((chunk + 1))
            out=$(python scripts/download.py --year "$AUDIT_YEAR" --max-files "${{ inputs.chunk_size }}" | tee /dev/stderr)
            python scripts/find_pages.py
            commit_push "chunk $chunk ($(echo "$out" | tail -1))"
            downloaded=$(echo "$out" | sed -n 's/.*downloaded=\([0-9]*\).*/\1/p' | tail -1)
            remaining=$(echo "$out" | sed -n 's/.*remaining=\([0-9]*\).*/\1/p' | tail -1)
            echo "chunk $chunk: downloaded=$downloaded remaining=$remaining"
            [ "${downloaded:-0}" = "0" ] && break
            [ "${remaining:-0}" = "0" ] && break
            [ "${{ inputs.max_chunks }}" != "0" ] && [ "$chunk" -ge "${{ inputs.max_chunks }}" ] && break
            [ $(( $(date +%s) - start )) -ge "$budget" ] && { echo "Time budget reached; re-run to resume."; break; }
          done
      - name: Summary
        if: always()
        run: |
          echo "## Fetch summary" >> "$GITHUB_STEP_SUMMARY"
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, collections, pathlib
          p = pathlib.Path("output/progress.csv")
          if p.exists():
              c = collections.Counter(r["status"] for r in csv.DictReader(p.open()))
              for k, v in sorted(c.items()):
                  print(f"- {k}: {v}")
          else:
              print("No progress.csv yet - check the log and output/listing_debug/.")
          PY
