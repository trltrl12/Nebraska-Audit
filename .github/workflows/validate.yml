name: validate

# Runs whenever a Claude session pushes new extractions to output/json/.
on:
  push:
    branches: [main]
    paths:
      - "output/json/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: output-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract (OCR for checking amounts on scanned pages)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          echo "TESSDATA_PREFIX=$(dirname "$(find /usr/share -name eng.traineddata | head -1)")" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/build_csv.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ ':!output/json'
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "validate: update flagged, progress and CSV/XLSX outputs [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $(( 2 ** i ))
          done
          echo "push failed"; exit 1
