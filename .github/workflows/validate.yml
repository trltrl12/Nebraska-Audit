name: validate

# Runs whenever a Claude session pushes new extractions to output/json/.
on:
  push:
    branches: [main]
    paths:
      - "output/json/**"
  workflow_dispatch:

permissions:
  contents: write

# Own queue: only the newest validate matters, and a waiting fetch is never bumped by it.
concurrency:
  group: validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract (OCR for checking amounts on scanned pages)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          echo "TESSDATA_PREFIX=$(dirname "$(find /usr/share -name eng.traineddata | head -1)")" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      # OCR results for scanned pages persist between runs, so a run that is cut off keeps its progress.
      - name: Restore OCR cache
        uses: actions/cache/restore@v4
        with:
          path: output/page_text
          key: page-text-${{ github.run_id }}
          restore-keys: page-text-
      - name: OCR scanned pages not cached yet (parallel)
        id: warm
        timeout-minutes: 150
        continue-on-error: true
        run: python scripts/pagecheck.py --warm
      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/page_text
          key: page-text-${{ github.run_id }}
      - name: Stop if OCR didn't finish (the next run continues from the saved cache)
        if: steps.warm.outcome != 'success'
        run: echo "OCR cache incomplete; rerun to continue" && exit 1
      - run: python scripts/validate.py
      - run: python scripts/build_csv.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ ':!output/json'
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "validate: update flagged, progress and CSV/XLSX outputs [skip ci]"
          for i in 1 2 3 4; do
            # Generated files: on a conflict keep this run's version (-X theirs = the commit being replayed).
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $(( 2 ** i ))
          done
          echo "push failed"; exit 1
